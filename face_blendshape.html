
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Face Model</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { MindARThree } from 'mindar-face-three';

    const container = document.querySelector('#container');

    const mindar = new MindARThree({ container });
    const { renderer, scene, camera } = mindar;

    // แสงในฉาก
    scene.add(
      new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2)
    );

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(0, 2, 3);
    scene.add(light);

    // ตั้งค่า GLTF Loader และ Draco
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath(
      'https://www.gstatic.com/draco/versioned/decoders/1.5.7/'
    );

    const loader = new GLTFLoader();
    loader.setDRACOLoader(dracoLoader);

    // โมเดล GLB ของคุณจาก GitHub
    const modelURL =
      'https://raw.githubusercontent.com/ketareiei-design/Face-Texture/main/face%20AR.compressed.glb';

    try {
      const gltf = await loader.loadAsync(modelURL);
      const model = gltf.scene;

      // ปรับขนาดโมเดลได้ตามต้องการ
      model.scale.setScalar(1);

      // เปิดใช้วัสดุและแสดงโมเดล
      model.traverse((object) => {
        if (object.isMesh) {
          object.frustumCulled = false;
          object.material.side = THREE.DoubleSide;
        }
      });

      // ผูกโมเดลเข้ากับจุดติดตามใบหน้า
      const anchor = mindar.addAnchor(1);
      anchor.group.add(model);

      // รวบรวม Morph Targets
      const meshes = [];

      model.traverse((object) => {
        if (
          object.isMesh &&
          object.morphTargetDictionary &&
          object.morphTargetInfluences
        ) {
          meshes.push(object);
          console.log(
            'Morph Targets:',
            object.morphTargetDictionary
          );
        }
      });

      // จับคู่ Blendshape ของกล้องกับชื่อ Morph Target ในโมเดล
      // โมเดลนี้มีชื่อ Target เป็น EyeBlink L, EyeBlink R,
      // mouth D และ mouth up
      const aliases = {
        eyeBlinkLeft: 'EyeBlink L',
        eyeBlinkRight: 'EyeBlink R'
      };

      await mindar.start();

      renderer.setAnimationLoop(() => {
        const categories =
          mindar.getLatestEstimate()?.blendshapes?.categories ?? [];

        for (const mesh of meshes) {
          for (const item of categories) {
            const targetName =
              aliases[item.categoryName] ?? item.categoryName;

            const index =
              mesh.morphTargetDictionary[targetName];

            if (index !== undefined) {
              mesh.morphTargetInfluences[index] = item.score;
            }
          }
        }

        renderer.render(scene, camera);
      });

    } catch (error) {
      console.error('ไม่สามารถโหลดโมเดลหรือเริ่ม AR ได้:', error);
      container.innerHTML =
        '<p style="color:red;padding:20px">โหลดโมเดลไม่สำเร็จ กรุณาตรวจสอบ URL และสิทธิ์การเปิดกล้อง</p>';
    }
  </script>
</body>
</html>
